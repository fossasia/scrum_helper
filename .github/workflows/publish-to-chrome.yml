name: Publish to Chrome Web Store

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Sync manifest version to tag
        run: |
          VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          echo "Syncing version to $VERSION"
          jq ".version = \"$VERSION\"" package.json > temp.json && mv temp.json package.json
          jq ".version = \"$VERSION\"" src/manifests/chrome.json > temp.json && mv temp.json src/manifests/chrome.json
          jq ".version = \"$VERSION\"" src/manifests/firefox.json > temp.json && mv temp.json src/manifests/firefox.json
          jq ".version = \"$VERSION\"" src/manifests/opera.json > temp.json && mv temp.json src/manifests/opera.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Build Extension
        run: npm ci && npm run build

      - name: Create ZIP file
        run: |
          if [ ! -d dist/chrome ]; then
            echo "dist/chrome directory not found"
            exit 1
          fi
          cd dist/chrome
          zip -r ../../scrum-helper.zip . >/dev/null
          echo "Created zip:"
          unzip -l ../../scrum-helper.zip
          if unzip -l ../../scrum-helper.zip | awk '{print $4}' | grep -q '^manifest.json$'; then
            echo "manifest.json is at zip root"
          else
            echo "ERROR: manifest.json NOT at zip root"
            exit 1
          fi

      - name: Get Fresh Access Token
        id: token
        run: |
          TOKEN=$(curl -sf -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${{ secrets.CHROME_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CHROME_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token" | jq -r '.access_token')
          echo "access_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Upload to Chrome Web Store
        run: |
          curl -f -X PUT \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -T scrum-helper.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}"

      - name: Publish to Chrome Web Store
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}/publish"
